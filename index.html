<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>pokero</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0d3b2e;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        font-family: system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0d3b2e;
        touch-action: none;
      }

      #choices {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 12px;
        padding: 10px 10px max(10px, env(safe-area-inset-bottom));
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
        box-sizing: border-box;
        height: 34%;
        pointer-events: none;
      }

      #choices button {
        pointer-events: auto;
        margin: 0;
        padding: 6px 4px;
        border: 1px solid #777777;
        border-radius: 8px;
        background: #555555;
        color: #f2f2f2;
        font: 700 22px/1.1 system-ui, sans-serif;
        letter-spacing: 0.02em;
        cursor: pointer;
        white-space: normal;
        overflow-wrap: anywhere;
        hyphens: auto;
      }

      #choices button:disabled {
        cursor: default;
      }

      #choices button.right {
        background: #2f9e55;
        border-color: #7dffb3;
      }

      #choices button.wrong {
        background: #b33a3a;
        border-color: #ff8a8a;
      }

      #choices button.answer {
        background: #c9a227;
        border-color: #ffe08a;
        color: #111111;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div id="choices"></div>
    <script src="js/card.js?v=0.1.0"></script>
    <script src="js/hand.js?v=0.1.0"></script>
    <script src="js/pokero.js?v=0.1.0"></script>
  </body>
</html>
