<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>pokero</title>
    <link rel="stylesheet" href="css/style.css?v=0.2.1" />
  </head>
  <body>
    <canvas id="board"></canvas>

    <div id="hud" hidden>
      <button id="btn-back" type="button">←</button>
      <div id="hearts"></div>
      <div id="hud-right">
        <div id="hi">HI: <span id="hi-value">0</span></div>
        <div id="score">SCORE: <span id="score-value">0</span></div>
      </div>
    </div>

    <div id="timer" hidden>
      <span id="timer-fill"></span>
    </div>

    <div id="choices" hidden></div>

    <div id="title-screen" class="overlay">
      <h1>POKERO</h1>
      <div id="title-suits"><span class="suit-black">♠</span><span class="suit-red">♥</span><span class="suit-black">♣</span><span class="suit-red">♦</span></div>
      <div class="title-actions">
        <button id="btn-call" type="button">CALL IT</button>
        <button id="btn-pick" type="button">PICK IT</button>
      </div>
      <a id="title-handle" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      <div id="title-ver">v=0.2.1</div>
    </div>

    <script src="js/card.js?v=0.2.1"></script>
    <script src="js/hand.js?v=0.2.1"></script>
    <script src="js/pokero.js?v=0.2.1"></script>
    
    <script data-goatcounter="https://justbobonx.goatcounter.com/count"
        async
        src="https://gc.zgo.at/count.v5.js"
        crossorigin="anonymous"
        integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
  </body>
</html>
